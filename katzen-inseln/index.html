<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Katzen-Inseln</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="theme-color" content="#1f8fd0">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b3d5c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;pointer-events:none;z-index:5}
.pill{background:rgba(0,0,0,.5);color:#fff;border-radius:20px;padding:7px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.hb{pointer-events:auto;border:none;border-radius:20px;padding:7px 12px;font-weight:800;font-size:16px;background:#ffcc33;color:#4a2b00;box-shadow:0 3px 0 #b8860b}
.hb:active{transform:translateY(2px);box-shadow:0 1px 0 #b8860b}
#hudRight{display:flex;gap:8px}
#flyBtn{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:98px;height:98px;border-radius:50%;border:none;font-size:15px;font-weight:900;z-index:5;background:#7fd7ff;color:#03314a;box-shadow:0 5px 0 #2a8fb8;display:none;line-height:1.2}
#flyBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a8fb8}
#flyBtn.landen{background:#ffb37f;box-shadow:0 5px 0 #c86a2a;color:#4a1d00}
#actBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));border:none;border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;background:#ffcc33;color:#4a2b00;box-shadow:0 4px 0 #b8860b;z-index:5;display:none}
#overlay{position:fixed;inset:0;background:rgba(0,20,40,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:18px;box-sizing:border-box}
.card{background:#fff8e7;border-radius:22px;padding:20px;max-width:430px;width:100%;max-height:88vh;overflow:auto;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h2{margin:0 0 8px;font-size:25px;color:#4a2b00}
.card p{margin:6px 0 12px;color:#5a4630;font-size:16px;line-height:1.4}
.card .big{font-size:54px;margin:2px 0}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ob{border:none;border-radius:14px;padding:13px 16px;font-weight:900;font-size:17px;background:#ffcc33;color:#4a2b00;box-shadow:0 4px 0 #b8860b}
.ob.sec{background:#e5dccb;color:#4a3b2b;box-shadow:0 4px 0 #b0a690}
.ob:disabled{opacity:.45}
.shopRow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin:8px 0;text-align:left;border:2px solid #f0e2c0}
.shopRow .e{font-size:34px}
.shopRow .t{flex:1;font-size:14px;color:#5a4630}
.shopRow b{font-size:16px;color:#4a2b00}
.howto{text-align:left;font-size:15px;color:#5a4630;line-height:1.45;padding-left:18px;margin:6px 0}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;font-size:15px;z-index:15;display:none;text-align:center;max-width:85vw}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div style="display:flex;gap:8px"><span class="pill" id="coinPill">🪙 0</span><span class="pill" id="infoPill" style="display:none"></span></div>
  <div id="hudRight"><button class="hb" id="hintBtn" style="display:none"></button><button class="hb" id="shopBtn">🛒 Laden</button><button class="hb" id="exitBtn" style="display:none">✖</button></div>
</div>
<button id="flyBtn">🪁<br>Fliegen</button>
<button id="actBtn"></button>
<div id="toast"></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script>
"use strict";
// ================= Grundlagen =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emoji(ch,x,y,size,col){ctx.fillStyle=col||'#000';ctx.font=size+'px '+EMOJI_FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- Speicherstand ----------
const SAVE_KEY='katzeninseln_v1';
let save={coins:0,sail:0,done:{},gold:false,raceWins:0,zoo:{},books:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)save=Object.assign(save,s);}catch(e){}
save.zoo=save.zoo||{};save.books=save.books||{};save.done=save.done||{};
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

// ---------- Ton ----------
let actx=null;
function beep(f,d,type,vol){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.08;o.connect(g);g.connect(actx.destination);const t=actx.currentTime;g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d);}catch(e){}}
const sfx={coin(){beep(988,.08,'square',.05);setTimeout(()=>beep(1319,.12,'square',.05),70)},
 jump(){beep(420,.15,'triangle',.08)},bad(){beep(140,.4,'sawtooth',.1)},win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.09),i*120))},
 splash(){beep(200,.3,'sine',.12);setTimeout(()=>beep(120,.4,'sine',.1),100)},click(){beep(660,.05,'square',.04)}};

// ---------- HUD / Overlay ----------
const $=id=>document.getElementById(id);
const coinPill=$('coinPill'),infoPill=$('infoPill'),flyBtn=$('flyBtn'),actBtn=$('actBtn'),shopBtn=$('shopBtn'),exitBtn=$('exitBtn'),hintBtn=$('hintBtn');
function updateCoins(){coinPill.textContent='🪙 '+save.coins;}
function addCoins(n){save.coins+=n;persist();updateCoins();}
let paused=false;
function showOverlay(html,buttons){
  paused=true;const card=$('card');card.innerHTML=html;
  const b=document.createElement('div');b.className='btns';
  (buttons||[]).forEach(bt=>{const e=document.createElement('button');e.className='ob'+(bt.sec?' sec':'');e.textContent=bt.label;if(bt.disabled)e.disabled=true;e.onclick=ev=>{ev.stopPropagation();sfx.click();if(!bt.keep)hideOverlay();bt.fn&&bt.fn();};b.appendChild(e);});
  card.appendChild(b);$('overlay').style.display='flex';
}
function hideOverlay(){$('overlay').style.display='none';paused=false;}
let toastT=null;
function toast(msg,ms){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms||1800);}

// ================= Zeichnen: Katze =================
const CAT={o:'#f4a23f',d:'#b8621a',w:'#fffaf3',pink:'#ff9fb4',eye:'#46b35f'};
function catEye(ex,ey,r,blink){
  if(blink){ctx.strokeStyle='#2b2b2b';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(ex,ey,r*0.7,0.2,Math.PI-0.2);ctx.stroke();return;}
  ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.ellipse(ex,ey,r*0.86,r,0,0,7);ctx.fill();
  ctx.fillStyle=CAT.eye;ctx.beginPath();ctx.ellipse(ex,ey+r*0.12,r*0.64,r*0.74,0,0,7);ctx.fill();
  ctx.fillStyle='#152';ctx.beginPath();ctx.ellipse(ex,ey+r*0.1,r*0.36,r*0.56,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-r*0.3,ey-r*0.38,r*0.34,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(ex+r*0.3,ey+r*0.32,r*0.15,0,7);ctx.fill();
}
// süßer Katzenkopf (Mitte = 0,0, Radius ca. 17)
function catHead(t){
  const blink=(t%4.2)<0.13;
  ctx.fillStyle=CAT.o;
  ctx.beginPath();ctx.moveTo(-15,-5);ctx.lineTo(-13,-25);ctx.lineTo(-2,-14);ctx.fill();
  ctx.beginPath();ctx.moveTo(15,-5);ctx.lineTo(13,-25);ctx.lineTo(2,-14);ctx.fill();
  ctx.fillStyle=CAT.pink;
  ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-11.5,-20);ctx.lineTo(-5,-14);ctx.fill();
  ctx.beginPath();ctx.moveTo(12,-9);ctx.lineTo(11.5,-20);ctx.lineTo(5,-14);ctx.fill();
  ctx.fillStyle=CAT.o;ctx.beginPath();ctx.ellipse(0,0,18,16,0,0,7);ctx.fill();
  ctx.strokeStyle=CAT.d;ctx.lineWidth=2.4;ctx.lineCap='round';
  [[-5,-15,-4,-9],[0,-16,0,-10],[5,-15,4,-9]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();});
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-13,1);ctx.moveTo(-17.5,4);ctx.lineTo(-13,4.5);ctx.moveTo(18,0);ctx.lineTo(13,1);ctx.moveTo(17.5,4);ctx.lineTo(13,4.5);ctx.stroke();
  ctx.fillStyle=CAT.w;
  ctx.beginPath();ctx.ellipse(-3.6,7.5,6.5,5,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(3.6,7.5,6.5,5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,11,5,4,0,0,7);ctx.fill();
  catEye(-6.5,-1.5,4.8,blink);catEye(6.5,-1.5,4.8,blink);
  ctx.fillStyle='rgba(255,130,150,.35)';ctx.beginPath();ctx.ellipse(-11,6,3.4,2.2,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(11,6,3.4,2.2,0,0,7);ctx.fill();
  ctx.fillStyle=CAT.pink;ctx.beginPath();ctx.moveTo(-2.4,4);ctx.lineTo(2.4,4);ctx.lineTo(0,6.6);ctx.fill();
  ctx.strokeStyle='#7a4a2a';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,6.6);ctx.lineTo(0,8);ctx.arc(-1.8,8,1.8,0,Math.PI);ctx.moveTo(0,8);ctx.arc(1.8,8,1.8,Math.PI,0,true);ctx.stroke();
  ctx.strokeStyle='rgba(90,60,40,.55)';ctx.lineWidth=0.9;
  ctx.beginPath();ctx.moveTo(-7,8);ctx.lineTo(-21,6);ctx.moveTo(-7,9.5);ctx.lineTo(-21,11);ctx.moveTo(7,8);ctx.lineTo(21,6);ctx.moveTo(7,9.5);ctx.lineTo(21,11);ctx.stroke();
}
function drawCatFace(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s/40,s/40);catHead(t);ctx.restore();}
function drawCat(x,y,s,facing,t,pose){
  ctx.save();ctx.translate(x,y);ctx.scale((facing<0?-1:1)*s/60,s/60);
  if(pose==='slide')ctx.scale(1.15,0.6);
  const run=pose==='run',tuck=(pose==='jump'||pose==='swing'||pose==='fly'||pose==='ride');
  const tw=Math.sin(t*6)*5;
  const tail=()=>{ctx.beginPath();ctx.moveTo(-19,-24);ctx.quadraticCurveTo(-42,-26+tw,-36,-50+tw);ctx.stroke();};
  ctx.lineCap='round';ctx.strokeStyle=CAT.o;ctx.lineWidth=8;tail();
  ctx.lineCap='butt';ctx.strokeStyle=CAT.d;ctx.setLineDash([3,6]);tail();ctx.setLineDash([]);
  ctx.fillStyle=CAT.w;ctx.beginPath();ctx.arc(-36,-50+tw,4.6,0,7);ctx.fill();
  const ph=run?Math.sin(t*18)*8:0;
  for(const [lx,p,far] of [[-14,ph,1],[10,-ph,1],[-8,-ph,0],[16,ph,0]]){
    let fx=lx+p,fy=-3;if(tuck){fx=lx+5;fy=-11;}
    ctx.strokeStyle=far?'#e08a2c':CAT.o;ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(lx,-18);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle=CAT.w;ctx.beginPath();ctx.ellipse(fx+1.5,fy,5,3.6,0,0,7);ctx.fill();
  }
  ctx.fillStyle=CAT.o;ctx.beginPath();ctx.ellipse(0,-25,24,13,0,0,7);ctx.fill();
  ctx.fillStyle=CAT.w;ctx.beginPath();ctx.ellipse(5,-18,17,7,0,0,7);ctx.fill();
  ctx.strokeStyle=CAT.d;ctx.lineWidth=3.2;ctx.lineCap='round';
  for(const sx of [-15,-7,1]){ctx.beginPath();ctx.moveTo(sx-2,-37);ctx.quadraticCurveTo(sx+3,-31,sx,-25);ctx.stroke();}
  ctx.save();ctx.translate(22,-42);catHead(t);ctx.restore();
  ctx.restore();
}
function drawCatBack(x,y,s,t,pose){
  ctx.save();ctx.translate(x,y);ctx.scale(s/60,s/60);
  if(pose==='roll'){ctx.fillStyle=CAT.o;ctx.beginPath();ctx.arc(0,-20,22,0,7);ctx.fill();ctx.strokeStyle=CAT.d;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-20,13,t*12,t*12+4);ctx.stroke();ctx.restore();return;}
  const ph=Math.sin(t*16);
  ctx.fillStyle=CAT.w;
  ctx.beginPath();ctx.ellipse(-9,-3+ph*3,6,5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(9,-3-ph*3,6,5,0,0,7);ctx.fill();
  const tw=Math.sin(t*7)*5;
  ctx.strokeStyle=CAT.o;ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-14);ctx.quadraticCurveTo(22,-22+tw,14,-48);ctx.stroke();
  ctx.fillStyle=CAT.w;ctx.beginPath();ctx.arc(14,-48,4.5,0,7);ctx.fill();
  ctx.fillStyle=CAT.o;ctx.beginPath();ctx.ellipse(0,-24,18,19,0,0,7);ctx.fill();
  ctx.strokeStyle=CAT.d;ctx.lineWidth=3.2;
  [-32,-25,-18].forEach(yy=>{ctx.beginPath();ctx.moveTo(-12,yy+2);ctx.quadraticCurveTo(0,yy-3,12,yy+2);ctx.stroke();});
  ctx.fillStyle=CAT.o;
  ctx.beginPath();ctx.moveTo(-15,-52);ctx.lineTo(-12,-72);ctx.lineTo(-2,-60);ctx.fill();
  ctx.beginPath();ctx.moveTo(15,-52);ctx.lineTo(12,-72);ctx.lineTo(2,-60);ctx.fill();
  ctx.fillStyle=CAT.pink;
  ctx.beginPath();ctx.moveTo(-12,-56);ctx.lineTo(-11,-67);ctx.lineTo(-5,-60);ctx.fill();
  ctx.beginPath();ctx.moveTo(12,-56);ctx.lineTo(11,-67);ctx.lineTo(5,-60);ctx.fill();
  ctx.fillStyle=CAT.o;ctx.beginPath();ctx.arc(0,-50,16,0,7);ctx.fill();
  ctx.strokeStyle=CAT.d;ctx.lineWidth=2.6;
  [[-5,-63,-4,-56],[0,-64,0,-57],[5,-63,4,-56]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();});
  ctx.restore();
}

// ================= Hilfen: Sprechblasen, Knöpfe, Figuren =================
function shade(hex,a){const n=parseInt(hex.slice(1),16);const f=v=>clamp(v+a,0,255);return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')';}
function wrapText(text,maxW){const words=String(text).split(' ');const lines=[];let line='';
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;}
  if(line)lines.push(line);return lines;}
function bubble(x,y,text,o){
  if(!text)return;o=o||{};const fs=o.fs||15;ctx.font='bold '+fs+'px system-ui,sans-serif';
  const maxW=o.maxW||Math.min(250,W*0.62);const lines=wrapText(text,maxW);
  let w=0;lines.forEach(l=>w=Math.max(w,ctx.measureText(l).width));w+=22;
  const lh=fs*1.25,h=lines.length*lh+14;
  const bx=clamp(x-w/2,6,W-w-6);let by=o.below?y+14:y-h-14;by=clamp(by,58,H-h-6);
  const tx=clamp(x,bx+16,bx+w-16),ty=o.below?by:by+h;
  ctx.fillStyle=o.bg||'#fff';ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(tx-9,ty);ctx.lineTo(x,y);ctx.lineTo(tx+9,ty);ctx.closePath();ctx.fill();ctx.stroke();
  rr(bx,by,w,h,12);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(tx-8,ty+(o.below?1.5:-1.5));ctx.lineTo(x,y);ctx.lineTo(tx+8,ty+(o.below?1.5:-1.5));ctx.fill();
  ctx.fillStyle=o.tc||'#3a2a1a';ctx.textAlign='left';ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,bx+11,by+7+i*lh));
}
function drawBtns(btns){
  for(const b of btns){
    ctx.globalAlpha=b.disabled?0.4:1;
    ctx.fillStyle='rgba(0,0,0,.25)';rr(b.x,b.y+4,b.w,b.h,b.r||14);ctx.fill();
    ctx.fillStyle=b.col||'#ffcc33';rr(b.x,b.y+(b.down?3:0),b.w,b.h,b.r||14);ctx.fill();
    if(b.sel){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();}
    ctx.fillStyle=b.tc||'#4a2b00';const fs=b.fs||Math.min(17,b.h*0.36);
    ctx.font='bold '+fs+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const lines=String(b.label).split('\n');
    lines.forEach((l,i)=>ctx.fillText(l,b.x+b.w/2,b.y+(b.down?3:0)+b.h/2+(i-(lines.length-1)/2)*fs*1.18));
  }
  ctx.globalAlpha=1;
}
function hitBtn(btns,x,y){if(!btns)return null;for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(!b.disabled&&x>=b.x&&x<=b.x+b.w&&y>=b.y-4&&y<=b.y+b.h+6)return b;}return null;}
// Knopfreihe unten
function btnRow(labels,y,h,o){o=o||{};const n=labels.length,gap=8,pad=10;const w=(W-pad*2-gap*(n-1))/n;
  return labels.map((l,i)=>Object.assign({x:pad+i*(w+gap),y,w,h,label:l.label,fn:l.fn,col:l.col,sel:l.sel,disabled:l.disabled,fs:o.fs},{}));}

// Reitlehrerin / Menschen-Figur
function drawPerson(x,y,s,o){
  o=o||{};ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);
  ctx.fillStyle='#3b2a20';ctx.fillRect(-14,-45,11,45);ctx.fillRect(3,-45,11,45);
  ctx.fillStyle=o.pants||'#e8e2d0';ctx.fillRect(-14,-58,28,20);
  ctx.fillStyle=o.shirt||'#2e8b57';rr(-18,-98,36,44,10);ctx.fill();
  ctx.strokeStyle=o.shirt||'#2e8b57';ctx.lineWidth=9;ctx.lineCap='round';
  const wave=o.wave?Math.sin(o.t*8)*0.6:0;
  ctx.beginPath();ctx.moveTo(-16,-90);ctx.lineTo(-26,-62);ctx.moveTo(16,-90);ctx.lineTo(30+wave*10,o.wave?-118:-64);ctx.stroke();
  ctx.restore();
  emoji(o.face||'👩',x,y-s*1.18,s*0.5);
}

// Pferd (Seitenansicht). x,y = Hufe-Mitte, s = Größe (100 = normal), face = 1 rechts / -1 links
const HOOF_X=[-32,30,-24,38];
function drawHorse(x,y,s,face,t,o){
  o=o||{};const c=o.c||'#8b5a2b',m=o.m||'#3b2414',g=o.gait||0;
  ctx.save();ctx.translate(x,y);ctx.scale((face<0?-1:1)*s/100,s/100);
  if(o.rear)ctx.rotate(-o.rear);
  const ph=t*[0,7,11,15][g],amp=g?1:0;
  ctx.lineCap='round';
  ctx.strokeStyle=m;ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-44,-66);ctx.quadraticCurveTo(-66,-54+Math.sin(ph)*5,-58,-20);ctx.stroke();
  const leg=(i,lx,a,far)=>{
    ctx.strokeStyle=far?shade(c,-35):c;ctx.lineWidth=10;
    const sw=Math.sin(a)*12*amp,lift=Math.max(0,Math.cos(a))*8*amp;
    ctx.beginPath();ctx.moveTo(lx,-50);ctx.lineTo(lx+sw*0.6,-26-lift);ctx.lineTo(lx+sw,-6-lift);ctx.stroke();
    ctx.fillStyle='#2b2b2b';ctx.fillRect(lx+sw-6,-8-lift,12,8);
    if(o.hooves&&o.hooves[i]){ctx.fillStyle='#8a7a6a';ctx.beginPath();ctx.arc(lx+sw-3,-2-lift,4,0,7);ctx.arc(lx+sw+4,-1-lift,3,0,7);ctx.fill();}
  };
  leg(0,HOOF_X[0],ph+Math.PI,1);leg(1,HOOF_X[1],ph,1);

const World={

    flyBtn.style.display='block';this.updFly();
  },
  spawnCoins(){
    this.coins=[];const R=mulberry32(42);
    ISLANDS.forEach(isl=>{if(isl.type==='monster')return;const n=isl.type==='start'?6:4;
      for(let k=0;k<n;k++){const a=R()*6.28,d=(0.25+R()*0.5)*isl.r;this.coins.push({x:isl.x+Math.cos(a)*d,y:isl.y+Math.sin(a)*d,taken:false});}});
  },
  updFly(){const c=this.cat;if(c.flying){flyBtn.innerHTML='🛬<br>Landen';flyBtn.classList.add('landen');}else{flyBtn.innerHTML=SAILS[save.sail].e+'<br>Fliegen';flyBtn.classList.remove('landen');}},
  toggleFly(){
    const c=this.cat;if(paused||c.dead||c.eaten)return;
    if(c.flying){c.flying=false;this.updFly();return;}
    if(c.alt>0.05)return;

  },
  islandAt(x,y,m){for(const isl of ISLANDS){if(Math.hypot(x-isl.x,y-isl.y)<isl.r-(m||0))return isl;}return null;},
  input(){
    let dx=0,dy=0;
    if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;
    if(this.joy){const jx=this.joy.x-this.joy.bx,jy=this.joy.y-this.joy.by,l=Math.hypot(jx,jy);if(l>8){const m=Math.min(1,l/55);dx=jx/l*m;dy=jy/l*m;}}
    const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
    return{dx,dy,m:Math.min(1,l)};
  },
  update(dt){

      showOverlay('<div class="big">👹</div><h2>Ham! Gefressen!</h2><p>Das Ungeheuer hat dich verschluckt! Du bist in seinem riesigen Labyrinth gelandet. Finde die <b>Schatztruhe</b>, hol dir den <b>Schlüssel</b> und öffne die <b>Tür</b>, um zu entkommen.</p>',
        [{label:'Los geht\'s!',fn:()=>{this.eatShown=false;setScene(Maze,{diff:isl.diff,from:isl});}}]);}return;}
    if(c.form){c.formT-=dt;setInfo(FORMS[c.form].e+' noch '+Math.ceil(c.formT)+' s');
      if(c.formT<6&&!this.formWarned){this.formWarned=true;toast('Gleich verwandelst du dich zurück! '+(c.form==='dolphin'?'Schnell an Land!':''),2500);}
      if(c.formT<=0){c.form=null;setInfo('');c.stam=SAILS[save.sail].time;toast('Puff! Du bist wieder eine Katze.');}}
    const inp=this.input(),sail=SAILS[save.sail];

      if(inp.m>0.2){c.dir={x:inp.dx/inp.m,y:inp.dy/inp.m};}
      c.vx=lerp(c.vx,c.dir.x*sail.speed,dt*4);c.vy=lerp(c.vy,c.dir.y*sail.speed,dt*4);
      if(c.form!=='bird')c.stam-=dt;c.alt=Math.min(1,c.alt+dt*3);
      if(c.stam<=0){c.stam=0;c.flying=false;this.updFly();toast('Puste aus – du sinkst!',1200);}
    }else{
      if(c.alt>0){c.alt=Math.max(0,c.alt-dt*2.2);c.vx*=1-dt*1.5;c.vy*=1-dt*1.5;}
      else{const sp=c.form==='cheetah'?400:c.form==='dolphin'&&!this.islandAt(c.x,c.y,4)?230:165;c.vx=inp.dx*sp;c.vy=inp.dy*sp;if(inp.m>0.2)c.dir={x:inp.dx/inp.m,y:inp.dy/inp.m};}

    const n=12+d*6;let last='';
    for(let i=0;i<n;i++){
      const pool=['log','log','branch','gap','rope','rope'];if(d>1)pool.push('combo');

      if(k==='log'){const x=cur+180;this.obs.push({type:'log',x,w:44,h:44});for(let j=0;j<4;j++)this.coins.push({x:x-60+j*40+22,y:-110-Math.sin(j/3*3.14)*30});ext(460);}

      else if(k==='rope'){ext(140);const s=gapTo(330);const ax=s+165;this.ropes.push({ax,ay:-320,L:250});this.coins.push({x:ax,y:-90});ext(380);}
      else if(k==='combo'){const x=cur+160;this.obs.push({type:'log',x,w:44,h:44});this.obs.push({type:'branch',x:x+250,w:100});ext(560);}
    }
    ext(500);this.finish=cur-250;ext(600);
    this.cat={x:120,y:0,vy:0,slide:0,ground:true,coyote:0,swing:null,dead:false,lastRope:null};
    this.speed=255+d*25;
    showOverlay(`<div class="big">🧗</div><h2>${this.isl.name}</h2><p>Die Katze rennt von allein.<br><b>Wisch hoch</b> = springen<br><b>Wisch runter</b> = rutschen (unter Ästen durch)<br>Spring an die <b>Seile</b>, um übers Wasser zu schwingen!</p>`,[{label:'Los!'}]);
  },

  jump(){const c=this.cat;if(c.dead||c.swing)return;if(c.ground||c.coyote>0){c.vy=-830;c.ground=false;c.coyote=0;c.slide=0;sfx.jump();}},
  doSlide(){const c=this.cat;if(c.dead)return;if(c.ground)c.slide=0.75;else if(!c.swing)c.vy=Math.max(c.vy,600);},
  onGround(x){return this.ground.some(g=>x>g[0]-6&&x<g[1]+6);},

    setTimeout(()=>challengeLose(this.isl,icon,title,txt,()=>setScene(Parkour,{isl:this.isl})),500);},
  update(dt){
    const c=this.cat;this.t+=dt;if(c.dead){c.vy+=1800*dt;c.y+=c.vy*dt;return;}
    if(c.swing){const s=c.swing;s.t+=dt/0.85;const a=lerp(s.a0,0.95,Math.min(1,s.t));
      c.x=s.r.ax+Math.sin(a)*s.r.L;c.y=s.r.ay+Math.cos(a)*s.r.L;
      if(s.t>=1){c.swing=null;c.vy=-520;c.lastRope=s.r;}
    }else{
      c.x+=this.speed*dt;

      const over=this.onGround(c.x);
      if(c.y>=0&&over&&c.y<30){c.y=0;c.vy=0;if(!c.ground){c.ground=true;}c.coyote=0.12;}
      else{if(c.ground)c.coyote=0.12;c.ground=false;c.coyote-=dt;}

const Maze={
  enter(o){

      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(m[ny]&&m[ny][nx]===0&&dist[nx+','+ny]===undefined){dist[nx+','+ny]=dd+1;q.push([nx,ny]);}}}

  update(dt){

        showOverlay('<div class="big">🧰</div><h2>Eine Schatztruhe!</h2><p>Was da wohl drin ist?</p>',[{label:'Truhe öffnen',fn:()=>{this.chest.open=true;this.hasKey=true;addCoins(10);sfx.win();setInfo('🔑 Schlüssel: ✅');

    }

    if(c==='treiben'){const s=T.kids.find(k=>k.stuck);if(s){s.stuck=false;this.mySay=s.n+', treib dein Pony mit den Beinen an!';this.kidSay(s,'Es läuft wieder! Danke!');}else this.mySay='Schön weiterreiten!';}
    if(c==='loben'){this.mySay='Ihr habt das alle ganz toll gemacht! ⭐';T.kids.forEach((k,i)=>setTimeout(()=>this.kidSay(k,['Danke!','Yeah!','Das war toll!'][i]),200+i*300));if(T.plan===5)this.planDone();}
  },
  teachTap(x,y){const T=this.tc;const g=this.arenaGeom(),k=g.k,vx=(x-g.ox)/k,vy=(y-g.oy)/k;
    if(T.placing){let best=0,bd=1e9;for(let u=0;u<T.L;u+=5){const p=this.trackPos(u),d=Math.hypot(p[0]-vx,p[1]-vy);if(d<bd){bd=d;best=u;}}
      if(bd<70){T.obst=best;T.placing=false;sfx.win();this.mySay='Fertig! Da steht ein Hindernis.';if(T.plan===3)this.planDone();}return;}
    for(const kd of T.kids){if(kd.stuck){const p=this.trackPos(kd.u);if(Math.hypot(p[0]-vx,p[1]-vy)<45){this.cmd('treiben');return;}}}},
  planDone(){const T=this.tc;T.plan++;T.timer=0;sfx.coin();addCoins(2);this.coinsGot+=2;
    if(T.plan>=this.PLAN.length){T.done=true;setTimeout(()=>challengeWin(this.isl,this.coinsGot,'Deine Reitschüler sind begeistert – du bist eine super Reitlehrerin! Frau Sattler sagt: „Hatschi – danke!“ '),1200);}},
  updTeach(dt){const T=this.tc;if(T.done)return;
    if(this.mySayT!==undefined)this.mySayT+=dt;
    T.kids.forEach(k=>{if(k.sayT>0)k.sayT-=dt;if(k.hop>0)k.hop-=dt;if(k.stop>0)k.stop-=dt;
      const sp=T.gait<0||k.stuck||k.stop>0?0:[40,75,115][T.gait];const pu=k.u;k.u+=sp*dt;
      if(T.obst!=null&&sp>0){const L=T.L,a=((pu-T.obst)%L+L)%L,b=((k.u-T.obst)%L+L)%L;if(a>L-40&&b<40){
        if(T.gait>=1){k.hop=0.5;if(T.plan===4&&!k.jumped){k.jumped=true;this.kidSay(k,'Hui, gesprungen!');sfx.jump();}}
        else{k.u=pu-2;k.stop=1.2;this.kidSay(k,'Mein Pony springt nicht – zu langsam!');}}}
    });
    const allMove=T.kids.every(k=>!k.stuck&&k.stop<=0)&&T.gait>=0;
    if(T.plan===1&&T.gait===0&&allMove){T.timer+=dt;if(T.timer>4)this.planDone();}
    if(T.plan===2&&T.gait===1){
      if(!T.event&&T.timer>1.2){T.event=true;const k=T.kids[1];k.stuck=true;this.kidSay(k,'Hilfe! Mein Pony bleibt einfach stehen!');}
      if(allMove)T.timer+=dt;if(T.timer>5&&T.event)this.planDone();}
    if(T.plan===4&&T.kids.every(k=>k.jumped))this.planDone();
  },
  drawTeach(){
    const T=this.tc,t=this.t,g=this.arenaGeom(),k=g.k,P=(x,y)=>[g.ox+x*k,g.oy+y*k];
    ctx.fillStyle='#8fd18a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e2c48e';ctx.fillRect(g.ox,g.oy,AV*k,AH*k);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.strokeRect(g.ox-3,g.oy-3,AV*k+6,AH*k+6);
    ctx.strokeStyle='rgba(150,110,60,.35)';ctx.lineWidth=26*k;ctx.beginPath();for(let u=0;u<=T.L;u+=8){const p=P(...this.trackPos(u));u?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();
    if(T.placing){ctx.strokeStyle='rgba(255,204,51,'+(0.4+0.4*Math.sin(t*6))+')';ctx.lineWidth=30*k;ctx.stroke();}
    if(T.obst!=null){const p=this.trackPos(T.obst),q=this.trackPos(T.obst+3),ang=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2,[x,y]=P(...p),r=24*k;
      ctx.lineWidth=6;ctx.strokeStyle='#e53935';ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(x-Math.cos(ang)*r,y-Math.sin(ang)*r);ctx.lineTo(x+Math.cos(ang)*r,y+Math.sin(ang)*r);ctx.stroke();ctx.setLineDash([]);}
    const [cx,cy]=P(150,280);drawCat(cx,cy+20,50*k*1.4,1,t,'stand');emoji('📋',cx+26*k,cy,22);
    const items=T.kids.map(kd=>{const p=this.trackPos(kd.u),q=this.trackPos(kd.u+4);return{kd,p,face:q[0]>=p[0]?1:-1};}).sort((a,b)=>a.p[1]-b.p[1]);
    for(const {kd,p,face} of items){const [x,y]=P(...p),hop=kd.hop>0?Math.sin(kd.hop/0.5*Math.PI)*20*k:0;
      drawHorse(x,y+8-hop,32*k,face,t,{c:kd.c,m:kd.m,gait:(T.gait<0||kd.stuck||kd.stop>0)?0:T.gait+1,saddle:true,blanket:true,bridle:true,riderEmoji:kd.e});
      if(kd.stuck){emoji('❗',x,y-48*k,22);}
      if(kd.sayT>0)bubble(x,y-40*k,kd.say,{fs:13,maxW:140});}
    bubble(cx,cy-40*k,this.mySay,{fs:14,bg:'#fff3c4'});
    // Stundenplan
    const step=this.PLAN[Math.min(T.plan,this.PLAN.length-1)];
    ctx.fillStyle='rgba(255,248,231,.95)';rr(10,58,W-20,34,10);ctx.fill();ctx.fillStyle='#4a2b00';ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('📋 '+Math.min(T.plan+1,6)+'/6: '+step,20,75);
    const b1=[{label:'👋 Hallo',fn:()=>this.cmd('hallo')},{label:'🐢 Schritt',fn:()=>this.cmd('schritt'),sel:T.gait===0},{label:'🐎 Trab',fn:()=>this.cmd('trab'),sel:T.gait===1},{label:'💨 Galopp',fn:()=>this.cmd('galopp'),sel:T.gait===2}];
    const b2=[{label:'🚧 Hindernis',fn:()=>this.cmd('hindernis'),sel:T.placing},{label:'📣 Antreiben',fn:()=>this.cmd('treiben'),col:T.kids.some(k=>k.stuck)?'#ff9f7f':undefined},{label:'⭐ Loben',fn:()=>this.cmd('loben')}];
    this.btns=btnRow(b1,H-108,44,{fs:14}).concat(btnRow(b2,H-56,44,{fs:14}));drawBtns(this.btns);
  },
  // ---------- Hauptschleife ----------
  update(dt){this.t+=dt;
    if(this.step==='lead')this.updLead(dt);
    if(this.step==='forest')this.updForest(dt);
    if(this.step==='arena')this.updArena(dt);
    if(this.step==='teach')this.updTeach(dt);},
  draw(){
    if(this.step!=='saddle'&&this.step!=='choose')this.btns=[];
    if(this.step==='stall')this.drawStall();
    else if(this.step==='lead')this.drawLead();
    else if(this.step==='groom'||this.step==='saddle')this.drawGroom();
    else if(this.step==='choose'){this.drawGroom();this.btns=this.chooseBtns();drawBtns(this.btns);}
    else if(this.step==='forest')this.drawForest();
    else if(this.step==='arena')this.drawArena();
    else if(this.step==='teach')this.drawTeach();
  }
};

    if(this.ev===2){this.stadium(gy);const j=this.hj;if(!j)return;const cx=W/2,barY=gy-60-(j.height-1)*120;

      drawCat(px,py,64,1,t,j.phase==='jump'?'jump':'stand');
      const mw=W-60,mx=30,my=H-120;ctx.fillStyle='rgba(0,0,0,.4)';rr(mx,my,mw,30,15);ctx.fill();
      ctx.fillStyle='#4caf50';rr(mx+mw*(0.5-j.zone/2),my,mw*j.zone,30,6);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(mx+mw*j.ind-3,my-8,6,46);
      ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('Tippen, wenn der Strich im Grünen ist!',W/2,my+56);ctx.fillText('Fehlversuche: '+j.misses+'/2',W/2,my+78);
      ctx.fillText('Beste Höhe: '+(j.best?j.best.toFixed(2)+' m':'–'),W/2,gy+50);}
    if(this.ev===3){this.stadium(gy);const b=this.bw;if(!b)return;const scale=(W-90)/62,ox=40;
      for(let m=10;m<=60;m+=10){const x=ox+m*scale;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,gy-20);ctx.lineTo(x,gy+30);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(m+' m',x,gy+46);}

      if(b.ball)emoji('⚾',ox+b.ball.x*scale,gy-20-b.ball.y*scale,20);
      if(b.phase==='angle'||b.phase==='power'){const ang=(10+b.a*70)*Math.PI/180;if(b.phase==='angle'){ctx.strokeStyle='#ffcc33';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ox+10,gy-30);ctx.lineTo(ox+10+Math.cos(ang)*80,gy-30-Math.sin(ang)*80);ctx.stroke();}}

      const p=b.phase==='power'?b.p:b.P;const gr=ctx.createLinearGradient(mx,0,mx+mw,0);gr.addColorStop(0,'#7fe07f');gr.addColorStop(1,'#ff5252');ctx.fillStyle=gr;rr(mx,my,mw*p,26,13);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';
      ctx.fillText(b.phase==='power'?'💪 Tippe für die Kraft!':b.phase==='angle'?'📐 Tippe für den Winkel!':'Weite: '+(b.ball?b.ball.x.toFixed(1):'0')+' m',W/2,my+52);
      ctx.fillText('Versuch '+Math.min(2,b.tries+1)+'/2   Bester: '+b.best.toFixed(1)+' m',W/2,gy+76);}
    drawBtns(this.btns);
  }
};

const Zoo={
  enter(o){this.isl=o.isl;this.t=0;this.sx=0;this.drag=null;exitBtn.style.display='';save.zoo=save.zoo||{};

    const c=Math.floor((x+this.sx-10)/cw),r=Math.floor((y-top)/ch);if(c<0||r<0||r>=rows)return;const i=c*rows+r;if(i<ANIMALS.length)this.visit(i);},

  feed(i,ok){const a=ANIMALS[i];

    else drawCat(cx,cy,80,1,t,'stand');
