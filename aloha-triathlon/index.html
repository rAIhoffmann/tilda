<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aloha Triathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sonnig, verspielt – ein Inselspiel für Kinder
   IDEA: Hawaii als begehbare Spielzeugwelt, Verfolgerkamera hinter der Triathletin
   PICTURE: die 3D-Insel selbst, bildschirmfüllend
   COLOUR and TYPE: Ozeantürkis, Korallenrot, Sonnengelb auf Cremekarten · Baloo 2
   LAYOUT: Vollbild-Welt, Chips oben, Joystick links, Aktionsknöpfe rechts, Handy als Overlay */
:root{--ink:#0d3b48;--sea:#1aa3c8;--coral:#ff6f61;--sun:#ffd23f;--card:#fffaf0;--mut:#5d7a82}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd8f7;font:16px/1.4 "Baloo 2",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:0;border-radius:14px;min-height:44px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(13,59,72,.25)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(13,59,72,.25)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.45}
[hidden]{display:none!important}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,250,240,.93);border-radius:12px;padding:2px 10px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 2px 0 rgba(13,59,72,.18);display:flex;align-items:center;gap:6px;min-height:30px}
.chip i{display:block;width:50px;height:9px;border-radius:5px;background:#d9e4e6;overflow:hidden}
.chip i b{display:block;height:100%;border-radius:5px;background:var(--c)}
#cDmg{background:#ffd0cb}
.tb{display:flex;gap:6px;pointer-events:auto;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.tb button{background:var(--sun);padding:4px 12px}
#bPhone{background:var(--ink);color:#fff}
#course,#nav{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 100px);max-width:96vw}
#course{background:var(--ink);color:#fff;border-radius:16px;padding:5px 6px 5px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;line-height:1.2;width:max-content}
#course button{min-height:36px;background:var(--coral);color:#fff;padding:2px 10px}
#course #cList{background:var(--sun);color:var(--ink)}
.sl{overflow-x:auto;margin:6px -4px}.sl table{border-collapse:collapse;width:100%;font-size:13px}.sl th{font-size:11px;font-weight:700;padding:2px 3px;color:var(--mut)}.sl td{padding:5px 3px;border-top:1px solid #e3e9ea;text-align:center;vertical-align:middle}.sl td:first-child{text-align:left;min-width:8.5em}.sl td small{display:block;font-size:11px;color:var(--mut);line-height:1.2}.sl td small.now{color:var(--sea);font-weight:700}
.sk{display:inline-block;min-width:2.6em;border-radius:8px;padding:1px 3px;font-weight:700;font-size:12px}.sk.ok{background:#bdf0c6}.sk.mid{background:#ffe9a8}.sk.no{background:#e7eef0;color:var(--mut)}
#nav{background:rgba(255,250,240,.95);border-radius:12px;padding:3px 12px;font-weight:700;font-size:15px;text-align:center;width:max-content}
#joy{position:fixed;left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 18px);width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.65);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(13,59,72,.3);pointer-events:none}
#acts{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#acts button{min-width:124px;min-height:56px;border-radius:28px;font-size:17px}
#bAct{background:var(--coral);color:#fff;min-height:68px!important;font-size:19px!important;max-width:58vw;white-space:normal}
#bJump{background:var(--sun);min-height:80px!important;min-width:140px!important;font-size:22px!important}
#toast{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:86vw;font-size:18px}
#toast.on{opacity:1}#toast.huge{font-size:64px;padding:4px 34px;background:var(--coral)}
.ov{position:fixed;inset:0;background:rgba(13,59,72,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:22px;padding:18px;width:min(460px,100%);max-height:88vh;overflow:auto;box-shadow:0 8px 0 rgba(13,59,72,.25);touch-action:pan-y}
.card h2{margin:0 0 6px;font-size:32px;line-height:1.05;font-weight:800;text-wrap:balance}
.card p{margin:4px 0 10px}
#mBtns{display:grid;gap:8px;margin-top:10px}
.mb{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mb small{font-weight:500;color:var(--mut);font-size:14px;text-align:right}
.mb.x{background:#e7eef0;justify-content:center}
.stat{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.6em;gap:5px 8px;align-items:center;font-size:15px;margin:6px 0}
.stat i{height:10px;border-radius:5px;background:#d9e4e6;overflow:hidden;display:block}.stat i b{display:block;height:100%;background:var(--c,#1aa3c8)}
.stat span:last-child{text-align:right;font-weight:700}
.pill{display:inline-block;background:#e7eef0;border-radius:10px;padding:0 8px;margin:2px;font-size:14px}
#game{position:fixed;inset:0;background:#0d3b48;display:flex;flex-direction:column}
.gbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff}
.gbar b{font-size:20px;white-space:nowrap}.gbar span{flex:1;font-size:14px;opacity:.92}
#gc{flex:1;width:100%;touch-action:none;display:block}
#gDom{flex:1;overflow:auto;padding:12px;color:var(--ink);touch-action:pan-y}
.gcard{background:var(--card);border-radius:20px;padding:16px;max-width:540px;margin:0 auto}
.gcard h3{margin:0 0 6px;font-size:24px;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ing{font-size:34px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ok{background:#bdf0c6!important}.bad{animation:sh .3s;background:#ffd0cb!important}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{width:100%;min-height:60px;font-size:20px;background:var(--coral);color:#fff}
.row button.have:disabled{opacity:1}
.ans{display:grid;gap:8px;margin-top:10px}.ans button{text-align:left}
#ward{position:fixed;left:0;right:0;bottom:0;height:50vh;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:12px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -6px 0 rgba(13,59,72,.15)}
.whead{display:flex;gap:8px;align-items:center;flex:none}
.whead h2{margin:0;font-size:24px;flex:1}

.wtabs button{flex:none;background:#e7eef0}.wtabs button.on{background:var(--sea);color:#fff}
#wList{overflow:auto;flex:1;touch-action:pan-y}
#wList h3{margin:8px 0 6px;font-size:16px}
.sw{display:flex;flex-direction:column;align-items:stretch;padding:6px;min-height:98px;font-size:12px;font-weight:600;line-height:1.15;text-align:center;gap:4px}
.sw .px{height:44px;border-radius:10px;border:2px solid rgba(13,59,72,.15)}
.sw.on{outline:3px solid var(--coral)}
#fade{position:fixed;inset:0;background:#0d3b48;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .6s;text-align:center;padding:20px;line-height:1.15}
#fade.on{opacity:1;pointer-events:auto}
input[type=text]{font:inherit;font-size:18px;width:100%;padding:10px 12px;border-radius:12px;border:2px solid #c9d8dc;min-height:48px;-webkit-user-select:text;user-select:text}
#mapc{width:100%;aspect-ratio:1;display:block;border-radius:16px;background:#1ea7c9;touch-action:none}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.navgrid button{font-size:14px;min-height:40px;padding:4px 8px}
.navgrid button.on{background:var(--sea);color:#fff}
/* Handy */
.ph{width:min(380px,100%);height:min(740px,94vh);background:#14232b;border-radius:40px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 0 rgba(0,0,0,.25),inset 0 0 0 3px #2c4450}
.phTop{display:flex;align-items:center;gap:8px;color:#fff;padding:2px 10px;min-height:40px}
.phTop b{flex:1;font-size:18px}.phTop span{font-size:14px;opacity:.8}
.phTop button{min-height:34px;padding:2px 12px;background:#2c4450;color:#fff;box-shadow:none}
#phScr{flex:1;overflow:auto;background:linear-gradient(#bfeaf7,#fffaf0 40%);border-radius:28px;padding:14px;touch-action:pan-y}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin-top:6px}
.app{background:none;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font-size:13px;line-height:1.1;min-height:90px}
.app i{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:800;color:#fff;box-shadow:0 3px 0 rgba(13,59,72,.25)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;margin:6px 0;box-shadow:0 2px 0 rgba(13,59,72,.12)}
.row .sq{width:44px;height:44px;border-radius:12px;flex:none}
.row div{flex:1;line-height:1.15}.row small{color:var(--mut);display:block}
.row button{min-height:40px;padding:2px 12px;background:var(--sun)}
.row button.have{background:#bdf0c6}
.qty{display:flex;align-items:center;gap:4px}.qty button{min-width:40px;padding:0;background:#e7eef0}.qty b{min-width:1.6em;text-align:center}
.phHome{background:#2c4450;color:#fff;box-shadow:none;align-self:center;padding:4px 26px}
#phScr h3{margin:10px 0 2px;font-size:17px}
#phScr .note{font-size:14px;color:var(--mut)}
@media(max-width:600px){.chip{font-size:12px;padding:1px 7px;min-height:26px}.chip i{width:34px}#joy{width:124px;height:124px}.tb button{padding:2px 9px;min-height:40px}}
@media (prefers-reduced-motion:reduce){#toast,#fade{transition:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="chips">
    <div class="chip" id="hDay"></div><div class="chip" id="hMoney"></div>

  </div>
  <div class="tb"><button id="bPhone">Handy</button><button id="bMap">Karte</button><button id="bWard">Kleider</button><button id="bMe">Ich</button></div>
</div>
<div id="course" hidden><span id="cInfo"></span><button id="cList" hidden>Liste</button><button id="cStop">Abbrechen</button></div>
<div id="nav" hidden></div>
<div id="joy"><div id="knob"></div></div>
<div id="acts"><button id="bJump" hidden>Springen!</button><button id="bCar" hidden>Einsteigen</button><button id="bAct" hidden></button></div>
<div id="toast"></div>
<div id="menu" class="ov" hidden><div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="phone" class="ov" hidden><div class="ph"><div class="phTop"><button id="phBack" hidden>Zurück</button><b id="phTitle">Handy</b><span id="phClock"></span></div><div id="phScr"></div><button class="phHome" id="phClose">Handy weglegen</button></div></div>
<div id="game" hidden><div class="gbar"><b id="gTitle"></b><span id="gInfo"></span><button id="gClose">Beenden</button></div><canvas id="gc"></canvas><div id="gDom"></div></div>
<div id="ward" hidden><div class="whead"><h2>Kleiderschrank</h2><button id="wDone">Fertig</button></div><div class="wtabs" id="wTabs"></div><div id="wList"></div></div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const D2R=Math.PI/180;
const P=(deg,r)=>({x:Math.cos(deg*D2R)*r,z:Math.sin(deg*D2R)*r});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lerpA=(a,b,k)=>{let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*Math.min(1,k)};
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};

/* ================= Kleidung ================= */
const COLORS=[['Korallenrot','#ff6f61'],['Hibiskus','#e63978'],['Lagune','#1fb5c9'],['Ozeanblau','#1f5fbf'],['Limette','#9be03a'],['Mango','#ffb22e'],['Sonnengelb','#ffe14d'],['Lavendel','#a68ce6'],['Schwarz','#22252b'],['Weiß','#f6f6f2'],['Mint','#7fe0c0'],['Pfirsich','#ffb59c'],['Flieder','#d7a9f0'],['Petrol','#0f6e78'],['Sand','#e3c99a'],['Jeansblau','#4a6fa5'],['Pink','#ff79c6'],['Waldgrün','#2e7d4f'],['Grau','#8a9099'],['Kirsche','#b3123a'],['Türkis','#2ed3c6'],['Himmelblau','#7cc6ff']];
const TOPS=['T-Shirt','Tanktop','Langarmshirt','Sport-Top','Hoodie'];
const BOTS=['Shorts','Leggings','Rock','Jeans','Radlerhose'];
const SHOES=['Sneaker','Laufschuhe','Sandalen','Stiefel','Reitstiefel','Flip-Flops'];
const PATN={streifen:'gestreift',punkte:'gepunktet',blumen:'Hibiskus'};
const HAIRS=['Offen','Pferdeschwanz','Dutt','Zwei Zöpfe','Kurz','Offen mit Blume','Dutt mit Blume','Zöpfe mit Blume'];
const SHADES=[['Blond','#f2d16b'],['Hellblond','#f7e3a1'],['Honigblond','#e0b24f'],['Erdbeerblond','#e9a86b'],['Aschblond','#d8c590']];
function rng(seed){seed=seed%2147483647;if(seed<=0)seed+=2147483646;return()=>(seed=seed*16807%2147483647,(seed-1)/2147483646)}
function collection(day){
  const r=rng(day*7919+101),pick=a=>a[Math.floor(r()*a.length)];
  const mk=(cat,types,n,pats)=>Array.from({length:n},(_,i)=>{const t=pick(types),[cn,c]=pick(COLORS),p=pick(pats);return{cat,t,c,p,n:t+' · '+cn+(p!=='uni'?' · '+PATN[p]:''),id:cat+day+'-'+i}});
  return{top:mk('top',TOPS,16,['uni','uni','streifen','punkte','blumen']),bot:mk('bot',BOTS,12,['uni','uni','uni','blumen','streifen','punkte']),shoe:mk('shoe',SHOES,12,['uni'])};
}

/* ================= Spielstand ================= */
const DEF={name:'Mia',money:120,day:0,energy:100,hunger:20,fuel:35,fit:{swim:10,bike:10,run:10},kraft:5,wechsel:5,laune:70,worked:-1,friendDay:{},trainerDay:-1,plan:null,planDone:{},best:{},races:0,wins:0,favs:[],nav:null,
  outfit:{top:{cat:'top',t:'Sport-Top',c:'#1fb5c9',p:'uni',n:'Sport-Top · Lagune',id:'s1'},bot:{cat:'bot',t:'Radlerhose',c:'#22252b',p:'uni',n:'Radlerhose · Schwarz',id:'s2'},shoe:{cat:'shoe',t:'Laufschuhe',c:'#ff6f61',p:'uni',n:'Laufschuhe · Korallenrot',id:'s3'},hair:'Pferdeschwanz',shade:'#f2d16b'},
  car:{x:9,z:410,rot:Math.PI},pos:{x:0,z:416.4,rot:Math.PI},
  furn:[],fridge:{ei:2,milch:1,mehl:1,banane:2,tomate:1,nudeln:1,kaese:1,reis:1,avocado:1},box:[],dmg:0,mat:false};
const KEY='aloha-triathlon-1';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
const fresh=!S;
S=Object.assign(JSON.parse(JSON.stringify(DEF)),S||{});
if(fresh||!S.v2){S.v2=1;S.pos={x:0,z:416.4,rot:Math.PI};if(Math.hypot(S.car.x-0,S.car.z-430)<17)S.car={x:9,z:410,rot:Math.PI}}
let COL=collection(S.day);

/* ================= Three.js Grundlagen ================= */
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd8f7);
scene.fog=new THREE.Fog(0x9fdcf5,160,720);
const cam=new THREE.PerspectiveCamera(62,1,.1,1600);
scene.add(new THREE.HemisphereLight(0xffffff,0x5d8a46,.78));
const sun=new THREE.DirectionalLight(0xfff0d0,.75);sun.position.set(200,320,120);scene.add(sun);
let G=null;
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(G&&!G.dom)sizeGC()}
const mc={};const M=c=>mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c}));
function box(w,h,d,c,x=0,y=0,z=0,p=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='object'?c:M(c));m.position.set(x,y,z);p.add(m);return m}
function cyl(rt,rb,h,c,x=0,y=0,z=0,p=scene,seg=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),M(c));m.position.set(x,y,z);p.add(m);return m}
function sph(r,c,x,y,z,p=scene){const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),M(c));m.position.set(x,y,z);p.add(m);return m}
function plane(w,d,c,x,y,z,rot=0,p=scene){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c));m.rotation.x=-Math.PI/2;m.rotation.z=rot;m.position.set(x,y,z);p.add(m);return m}
function disc(r,c,x,y,z,seg=32){const m=new THREE.Mesh(new THREE.CircleGeometry(r,seg),M(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);scene.add(m);return m}
function label(text,x,y,z,s=1){
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;const g=cv.getContext('2d');
  g.font='bold 58px Arial Rounded MT Bold, Arial, sans-serif';const w=Math.min(500,g.measureText(text).width+56);
  g.fillStyle='rgba(255,250,240,.95)';g.beginPath();const x0=256-w/2;g.moveTo(x0+30,10);g.arcTo(x0+w,10,x0+w,118,30);g.arcTo(x0+w,118,x0,118,30);g.arcTo(x0,118,x0,10,30);g.arcTo(x0,10,x0+w,10,30);g.fill();
  g.fillStyle='#0d3b48';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,68,480);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthWrite:false}));sp.position.set(x,y,z);sp.scale.set(14*s,3.5*s,1);scene.add(sp);return sp}
const obs=[],I=[],roads=[];

/* ---------- Straßennetz fürs Navi ---------- */
const NAV={nodes:[],adj:[]};

/* ---------- Gespräche ---------- */
function talk(n){
  const f=n.follow;say(n,pick(n.lines.hi));
  if(n===MYLA){const sat=S.day%7===5;
    if(f)return menu('Myla',`<p>„Ich bin bei dir! Bei jedem Training helfe ich dir – du kommst 50 % schneller voran."</p>`+planHtml(),[{t:'Danke, bis nächste Woche!',f:()=>{n.follow=false;n.goHome=true;say(n,'Bis Samstag!')}}]);
    if(!sat)return menu('Myla',`<p>„Aloha ${esc(S.name)}! Ich trainiere mit dir jeden <b>Samstag</b>. Bis dahin: halte dich an deinen Plan!"</p>`+planHtml());
    return menu('Myla',`<p>„Heute ist Trainingstag! Ich komme mit und helfe dir bei allem, was du trainierst."</p>`+planHtml(),[{t:'Los, komm mit!',f:()=>{n.follow=true;n.goHome=false;
      if(S.trainerDay!==S.day){S.trainerDay=S.day;if(planDone()){S.money+=40;['swim','bike','run'].forEach(k=>gainFit(k,3));toast('Wochenplan geschafft! Myla schenkt dir 40 $ Bonus.')}newPlan()}
      say(n,'Auf geht\'s! Wohin zuerst?')}}])}
  const ate=S.friendDay[n.name]===S.day;
  menu(n.name,`<p>„${pick(n.lines.hi)}"</p>`,[
    f?{t:'Tschüss, bis bald!',f:()=>{n.follow=false;n.goHome=true;say(n,'Bis bald!')}}:{t:'Komm mit!',s:'begleitet dich',f:()=>{n.follow=true;n.goHome=false;say(n,'Au ja, ich komm mit!')}},
    {t:'Zusammen essen',s:ate?'Heute schon':'Hunger −40, Laune +',dis:ate,f:()=>{S.friendDay[n.name]=S.day;S.hunger=clamp(S.hunger-40,0,100);S.energy=clamp(S.energy+10,0,100);S.laune=clamp(S.laune+10,0,100);say(n,'Mmmh, lecker!')}},
    {t:'Quatschen',s:'Laune +',f:()=>{S.laune=clamp(S.laune+5,0,100);say(n,pick(n.lines.tip))}}])}
function callNPC(n){if(n===MYLA&&S.day%7!==5)return'Myla: „Heute kann ich nicht, wir trainieren am Samstag zusammen!"';
  n.follow=true;n.goHome=false;const fx=Math.sin(pl.rot),fz=Math.cos(pl.rot);n.inside=pl.inside;n.x=pl.x-fx*3;n.z=pl.z-fz*3;say(n,'Da bin ich!');
  if(n===MYLA&&S.trainerDay!==S.day){S.trainerDay=S.day;if(planDone()){S.money+=40;['swim','bike','run'].forEach(k=>gainFit(k,3))}newPlan()}
  return n.name+' ist auf dem Weg und gleich bei dir!'}

const RIV={sprint:[['Lani',25],['Keoni',42],['Hoku',60]],iron:[['Lani',45],['Keoni',62],['Hoku',80]]};
function triSegs(iron){
  const L=iron?{s:2,b:2,r:3}:{s:1,b:1,r:1};
  const bike=[{x:TB.x,z:TB.z}];for(let k=0;k<=24*L.b;k++)bike.push(P(155+15*k,375));bike.push({x:TB.x,z:TB.z});
  const run=[{x:TB.x,z:TB.z},P(148,468),P(140,468),P(131,468),P(122,468),P(126,456),P(135,456),P(144,456)];
  return[{kind:'swim',pts:[atB(62,0),atB(120,45),atB(120,-45)],laps:L.s,cr:8},{kind:'bike',pts:bike,open:1,cr:11},{kind:'run',pts:run,laps:L.r,cr:6}]}
function targets(seg){if(seg.open)return seg.pts.slice(1);const t=[];for(let l=0;l<seg.laps;l++)for(let i=1;i<=seg.pts.length;i++)t.push(seg.pts[i%seg.pts.length]);return t}
function segLen(seg){let p=seg.pts[0],s=0;for(const q of targets(seg)){s+=dist(p,q);p=q}return s}
function triMenu(){
  const avg=(S.fit.swim+S.fit.bike+S.fit.run)/3,ironOk=avg>=35;
  menu('Triathlon-Strand',`<p>Schwimmen im Meer um die Bojen, Radfahren rund um die Insel, Laufen am Strand. Dazwischen musst du in der Wechselzone schnell sein.</p><p>Rennen: ${S.races} · Siege: ${S.wins}</p>`,[
   {t:'Sprint-Triathlon',s:'15 $ Startgeld · 35 Energie',dis:S.money<15,f:()=>need(35)&&startRace(false)},
   {t:'Ironman',s:ironOk?'40 $ · 70 Energie':'Erst ab Fitness-Schnitt 35 ('+avg.toFixed(0)+')',dis:!ironOk||S.money<40,f:()=>need(70)&&startRace(true)}])}
function startRace(iron){
  S.money-=iron?40:15;const segs=triSegs(iron);
  const riv=(iron?RIV.iron:RIV.sprint).map(([n,f],i)=>({n,T:segs.reduce((a,s)=>a+segLen(s)/rspd(s.kind,f)*1.15,0)+2*(15-i*2)}));
  const w=[];segs.forEach(s=>{let p=s.pts[0];for(const q of targets(s)){w.push(dist(p,q)/rspd(s.kind,50));p=q}});
  startCourse({name:iron?'Ironman':'Sprint-Triathlon',race:{riv,w,tot:w.reduce((a,b)=>a+b,0),done:0,k:0},segs,exit:{x:TB.x,z:TB.z},
   onDone:c=>{spend(iron?70:35);S.races++;const place=1+riv.filter(r=>r.T<c.t).length;if(place===1)S.wins++;
     const prize=(iron?[400,200,100,30]:[120,70,40,10])[place-1];S.money+=prize;['swim','bike','run'].forEach(k=>gainFit(k,iron?4:2));S.laune=clamp(S.laune+(place===1?20:8),0,100);
     const rows=[...riv.map(r=>({n:r.n,t:r.T})),{n:esc(S.name)+' (du)',t:c.t,me:1}].sort((a,b)=>a.t-b.t);
     menu(place===1?'Du hast gewonnen!':'Platz '+place+'!','<p>'+rows.map((r,i)=>`${i+1}. ${r.me?'<b>':''}${r.n} – ${fmt(r.t)}${r.me?'</b>':''}`).join('<br>')+`</p><p>Preisgeld: <b>${prize} $</b> · Alle Fitnesswerte steigen.</p>`+(place===1&&!S.furn.includes('pokale')?'<p><small>Tipp: Mit dem Pokal-Regal aus dem Möbel-Shop kannst du deine Pokale zu Hause zeigen.</small></p>':''))}})}

function startCourse(c){if(pl.mode==='car')exitCar();setCarry(null);course=Object.assign({si:0,t:0,err:0,laps:[]},c);startSeg()}
function startSeg(){const c=course,seg=c.segs[c.si];c.seg=seg;c.tg=targets(seg);c.i=0;c.n=seg.open?c.tg.length:seg.pts.length;c.cr=seg.cr;c.cd=3;c.lapT=c.t;c.cdShown=0;
  pl.mode=seg.kind;pl.x=seg.pts[0].x;pl.z=seg.pts[0].z;pl.rot=Math.atan2(c.tg[0].x-pl.x,c.tg[0].z-pl.z);pl.v=0;pl.jy=0;pl.jv=0;
  applyOutfit(seg.kind==='swim');beacon.visible=true;beacon.scale.set(c.cr,1,c.cr);moveBeacon();snapCam();
  NPCS.filter(n=>n.follow).forEach((n,i)=>{if(!c.race&&['run','bike','swim'].includes(seg.kind)){n.x=pl.x-Math.cos(pl.rot)*1.8*(i+1);n.z=pl.z+Math.sin(pl.rot)*1.8*(i+1)}})}
function moveBeacon(){const t=course.tg[course.i];beacon.position.set(t.x,3.6,t.z)}
function reach(){const c=course,t=c.tg[c.i];
  if(c.seg.kind==='horse'&&t.h){if(pl.jy>.3)toast('Sauber gesprungen!');else{c.err++;toast('Stange gefallen!')}}
  if(c.race){c.race.done+=c.race.w[c.race.k++]}
  c.i++;
  if(!c.seg.open&&c.i%c.n===0){if(c.t-c.lapT>.5)c.laps.push(c.t-c.lapT);c.lapT=c.t;if(c.i<c.tg.length)toast('Runde '+(c.i/c.n+1)+'!')}
  if(c.i>=c.tg.length)return segDone();moveBeacon()}
function segDone(){const c=course;pl.v=0;
  if(c.si<c.segs.length-1){c.wait=1;const go=()=>{c.si++;c.wait=0;startSeg();c.cd=.01};
    if(c.race)openWechsel(c.si===0?'T1':'T2',t=>{c.t+=t;go()});else go()}
  else endCourse(true)}
function endCourse(ok){const c=course;course=null;beacon.visible=false;pl.mode='walk';pl.v=0;pl.jy=0;applyOutfit();
  if(c.exit){pl.x=c.exit.x;pl.z=c.exit.z}snapCam();NPCS.filter(n=>n.follow).forEach(n=>{if(dist(n,pl)>20){n.x=pl.x+rnd(-2,2);n.z=pl.z+rnd(-2,2)}if(ok)say(n,n===MYLA?'Super gemacht! Ich bin stolz auf dich!':'Wow, du warst super!')});
  if(ok)c.onDone(c);else toast('Abgebrochen.')}
$('#cStop').onclick=()=>{if(lesson&&!paused)return endLesson();if(course&&!course.wait)endCourse(false)};

/* ================= Update ================= */
let hudT=0,navT=0,navWP=null,pickCD=0,matAnim=-1;
const ZP={door:Lp(0,13.7),fr:Lp(16.6,1.9),stove:Lp(11,1.9),chair:Lp(10,6.4),box:Lp(2.5,11),mat:Lp(-11,-6.1),bed:Lp(10,-8.2),ward:Lp(16.4,-5),mirror:Lp(4.9,-3),sofa:Lp(-9,9.7),ergo:Lp(-7,-10.1)};
const zin={};const enterZ=(k,c)=>{const w=zin[k];zin[k]=c;return c&&!w};
function update(dt){
  const {x:ix,y:iy}=inp(),m=pl.mode,veh=m==='car'||m==='kart';
  pl.status='';
  if(pl.act){if((ix||iy)&&!['sleep','eat'].includes(pl.act.k))endAct();else{actStep(dt);npcUpd(dt);scanI();hudT-=dt;if(hudT<0){hudT=.15;hud()}return}}
  if(course&&course.cd>0){course.cd-=dt;const n=Math.ceil(course.cd);if(n!==course.cdShown){course.cdShown=n;toast(n>0?String(n):'Los!',true)}if(course.cd<=0)toast('Los!',true);pl.v=0}
  else if(veh){
    const maxV=(m==='kart'?46:36)*(m==='car'?1-S.dmg/250:1),acc=m==='kart'?30:22;
    if(pl.crashT>0){pl.crashT-=dt;pl.rot+=pl.spin*pl.crashT*dt;pl.v*=Math.exp(-3*dt)}
    else{
      if(m==='car'&&S.dmg>=100&&iy){if(!pl.noFuel){toast('Totalschaden! Ruf mit dem Handy die Werkstatt.');pl.noFuel=1}}
      else if(m==='car'&&S.fuel<=0&&iy>0){if(!pl.noFuel){toast('Der Tank ist leer! Ruf mit dem Handy die Werkstatt.');pl.noFuel=1}}else pl.v+=iy*acc*dt;
      pl.v*=Math.exp(-dt*(iy?.2:1));pl.v=clamp(pl.v,-10,maxV);
      pl.rot-=ix*1.8*clamp(Math.abs(pl.v)/8,0,1)*Math.sign(pl.v||1)*dt}
    if(m==='car')S.fuel=Math.max(0,S.fuel-Math.abs(pl.v)*dt/110);
  }else{
    const sp=m==='walk'?(pl.inside?4.5:6.5):m==='horse'?14:spd(m),tv=iy>0?iy*sp:iy*sp*.4;
    pl.v+=(tv-pl.v)*Math.min(1,dt*(m==='bike'?2:6));
    pl.rot-=ix*({walk:2.6,run:2.4,swim:1.8,bike:1.6,horse:2}[m])*dt;
  }
  pl.x+=Math.sin(pl.rot)*pl.v*dt;pl.z+=Math.cos(pl.rot)*pl.v*dt;
  if(pl.jy>0){pl.jv-=16*dt;pl.jy+=pl.jv*dt;if(pl.jy<=0){pl.jy=0;pl.jv=0}}
  const inOcean=m==='swim'&&course&&!course.seg.pool;
  if(m!=='swim'){const v0=Math.abs(pl.v),hit=collide(pl.inside?intObs:obs,veh?1.6:.45);if(hit&&veh){if(m==='car'&&v0>11)crash(v0);else pl.v*=.6}}
  if(m==='swim'&&course&&course.seg.pool){pl.x=clamp(pl.x,PL.x-13.5,PL.x+13.5);pl.z=clamp(pl.z,PL.z-6,PL.z+6)}
  if(!pl.inside){const r=Math.hypot(pl.x,pl.z),mx=inOcean?720:530;if(r>mx){pl.x*=mx/r;pl.z*=mx/r;if(veh)pl.v*=.5}}
  if(course&&!course.wait){if(course.cd<=0)course.t+=dt;const t=course.tg[course.i];if(Math.hypot(pl.x-t.x,pl.z-t.z)<course.cr)reach()}
  if(!pl.inside&&veh)for(const t of traffic){const tp=t.m.position;if(dist(pl,tp)<3.2){if(m==='car'&&Math.abs(pl.v)>8&&pl.crashT<=0){crash(Math.abs(pl.v)+6);t.stop=3;t.spin=5;puff(tp.x,1,tp.z)}else pl.v*=-.3;const a=Math.atan2(pl.z-tp.z,pl.x-tp.x);pl.x=tp.x+Math.cos(a)*3.3;pl.z=tp.z+Math.sin(a)*3.3}}
  if(veh&&!pl.inside)NPCS.forEach(n=>{if(!n.follow&&dist(n,pl)<2.4&&Math.abs(pl.v)>2){const a=pl.rot+Math.PI/2;n.x+=Math.sin(a)*3;n.z+=Math.cos(a)*3;pl.v*=.3;say(n,'Hey, pass doch auf!',2.5)}});
  if(m==='car'&&S.dmg>70&&Math.random()<dt*3)puff(pl.x,1.3,pl.z,0x444444,.8);
  if(pl.inside)homeZones(dt,ix,iy);else if(m==='walk'&&!course){const d=dist(pl,HD);if(!doorReady&&d>3)doorReady=true;if(doorReady&&d<1.7)enterHouse()}
  if(lesson){if(pl.inside||dist(pl,PD)>110){toast('Du bist weggegangen – die Reitstunde ist vorbei.');endLesson()}else lessonUpd(dt,ix,iy)}

    else{n.v=0;if(face!==null)n.rot=lerpA(n.rot,face,dt*5)}
    if(n.follow&&pl.act&&!course&&n.v===0)n.rot=lerpA(n.rot,Math.atan2(pl.x-n.x,pl.z-n.z),dt*5);
    if(n.follow&&course&&mode==='cheer')n.rot=lerpA(n.rot,Math.atan2(pl.x-n.x,pl.z-n.z),dt*5);

   down(x,y){if(b.in||b.vx||b.vy||b.air>0)return;drag={x,y}},move(x,y){if(drag){drag.x=x;drag.y=y}},
   up(x,y){if(!drag)return;const dx=b.x-x,dy=b.y-y,l=Math.hypot(dx,dy),p=Math.min(l,45)/45;drag=null;if(p<.06)return;
     const vm=golf?110:150;lastP={x:b.x,y:b.y};b.vx=dx/l*p*vm;b.vy=dy/l*p*vm;if(golf)b.air=.35+p*.65;strokes++;info()},
   draw(g){const h=holes[hi];
    g.fillStyle=golf?'#4c9a3c':'#2f8f3a';g.fillRect(0,0,100,160);
    if(golf)(h.f||[]).forEach(r=>{g.fillStyle='#6cc35a';g.fillRect(...r);g.fillStyle='rgba(255,255,255,.07)';for(let y=r[1];y<r[1]+r[3];y+=10)g.fillRect(r[0],y,r[2],5)});
    else{g.strokeStyle='#8a5a2b';g.lineWidth=3;g.strokeRect(1.5,1.5,97,157)}
    (h.sand||[]).forEach(r=>{g.fillStyle='#f0d58c';rr(g,...r,5)});(h.water||[]).forEach(r=>{g.fillStyle='#2aa7d6';rr(g,...r,5)});
    if(golf)circ(g,h.h[0],h.h[1],11,'#8be07a');
    g.fillStyle='#8a5a2b';walls(h).forEach(w=>rr(g,...w,1.5));
    circ(g,h.h[0],h.h[1],3.2,'#11181c');g.fillStyle='#fff';g.fillRect(h.h[0]-.4,h.h[1]-14,.8,14);g.fillStyle='#ff3b3b';g.beginPath();g.moveTo(h.h[0]+.4,h.h[1]-14);g.lineTo(h.h[0]+8,h.h[1]-11);g.lineTo(h.h[0]+.4,h.h[1]-8);g.fill();
    if(drag){const dx=b.x-drag.x,dy=b.y-drag.y,l=Math.hypot(dx,dy)||1,p=Math.min(l,45)/45;g.fillStyle=`hsl(${120-p*120},90%,60%)`;for(let i=1;i<=8;i++){circ(g,b.x+dx/l*i*p*6,b.y+dy/l*i*p*6,.9,g.fillStyle)}}
    const lift=b.air>0?Math.sin(Math.min(1,b.air/.6)*Math.PI)*4:0;circ(g,b.x+.6,b.y+.8,1.6,'rgba(0,0,0,.25)');circ(g,b.x,b.y-lift,1.6+lift*.15,'#fff');
    if(!b.in&&!b.vx&&!b.vy&&strokes===0&&!drag){g.fillStyle='rgba(255,255,255,.9)';g.font='bold 5px "Baloo 2",sans-serif';g.textAlign='center';g.fillText('Ziehen und loslassen zum Schlagen',50,157)}
    gMsg(g,msg)}}}

/* ---------- Tennis ---------- */
function mkTennis(){
  let px=50,ax=50,b,me=0,op=0,gm=0,go=0,serve=0,wait=1,msg='',lvl=0;const PT=['0','15','30','40'];
  const reset=()=>{b={x:50,y:serve?28:132,vx:rnd(-25,25),vy:serve?58:-58};wait=.9};
  const sc=()=>me>=3&&op>=3?(me===op?'Einstand':me>op?'Vorteil du':'Vorteil Gegnerin'):PT[Math.min(me,3)]+' : '+PT[Math.min(op,3)];
  const info=()=>$('#gInfo').textContent=`Spiele ${gm} : ${go} · ${sc()} · Wer zuerst 4 Spiele hat, gewinnt`;
  function point(win){if(win)me++;else op++;msg=win?'Punkt für dich!':'Punkt Gegnerin';
    if(me>=4&&me-op>=2){gm++;me=op=0;serve^=1;lvl++;msg='Spiel gewonnen!'}else if(op>=4&&op-me>=2){go++;me=op=0;serve^=1;msg='Spiel verloren'}
    if(gm>=4||go>=4){const won=gm>go;endGame();spend(10);gainFit('run',1);S.laune=clamp(S.laune+(won?10:4),0,100);return menu(won?'Matchgewinn!':'Knapp verloren',`<p>Endstand <b>${gm} : ${go}</b> Spiele.</p>`)}
    reset();info()}
  return{init(){reset();info()},
   step(dt){if(K.l)px-=90*dt;if(K.r)px+=90*dt;px=clamp(px,8,92);if(wait>0){wait-=dt;if(wait<=0)msg='';return}
    ax+=clamp(b.x-ax,-(46+lvl*6)*dt,(46+lvl*6)*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<5){b.x=5;b.vx=Math.abs(b.vx)}if(b.x>95){b.x=95;b.vx=-Math.abs(b.vx)}
    if(b.vy>0&&b.y>=141&&b.y<151&&Math.abs(b.x-px)<11){b.vy=-Math.min(135,Math.abs(b.vy)*1.05);b.vx=(b.x-px)*5+rnd(-8,8);b.y=141}
    if(b.vy<0&&b.y<=19&&b.y>9&&Math.abs(b.x-ax)<10){b.vy=Math.min(135,Math.abs(b.vy)*1.04);b.vx=(b.x-ax)*4+rnd(-22,22);b.y=19}
    if(b.y>166)point(false);if(b.y<-6)point(true)},
   down(x){px=x},move(x){px=x},
   draw(g){g.fillStyle='#3f9b5a';g.fillRect(0,0,100,160);g.fillStyle='#3a6fc4';g.fillRect(6,8,88,144);g.strokeStyle='#fff';g.lineWidth=.8;g.strokeRect(6,8,88,144);g.strokeRect(16,40,68,80);g.beginPath();g.moveTo(50,40);g.lineTo(50,120);g.stroke();
    g.fillStyle='#eee';g.fillRect(2,79,96,2);
    const pl2=(x,y,c)=>{circ(g,x,y+(y>80?6:-6),3,'#f2c6a0');g.fillStyle=c;rr(g,x-10,y-1.5,20,3,1.5)};pl2(ax,16,'#e63978');pl2(px,146,'#ffd23f');
    if(S.outfit)circ(g,px,152,1.6,S.outfit.shade);
    circ(g,b.x+1,b.y+1.5,1.6,'rgba(0,0,0,.25)');circ(g,b.x,b.y,1.7,'#e8ff4d');gMsg(g,msg)}}}

/* ---------- Elfmeter ---------- */
function mkSoccer(){
  let n=0,goals=0,ball,kp,shot=null,msg='',msgT=0;const N=10;
  const info=()=>$('#gInfo').textContent=`Schuss ${Math.min(n+1,N)}/${N} · Tore ${goals} · Tipp ins Tor, wohin du schießen willst`;
  const reset=()=>{ball={x:50,y:135};kp={x:50,tx:50}};
  return{init(){reset();info()},
   down(x,y){if(shot||msgT>0||n>=N||y>70)return;shot={tx:x,ty:y,t:0};kp.tx=clamp(Math.random()<.32?x+rnd(-5,5):rnd(26,74),24,76)},
   step(dt){if(shot){shot.t+=dt*1.7;const k=Math.min(1,shot.t);ball.x=50+(shot.tx-50)*k;ball.y=135+(shot.ty-135)*k;kp.x+=clamp(kp.tx-kp.x,-75*dt,75*dt);
      if(k>=1){const inG=shot.tx>21&&shot.tx<79&&shot.ty>24&&shot.ty<48,saved=inG&&Math.abs(shot.tx-kp.x)<8;n++;if(inG&&!saved){goals++;msg='TOOOR!'}else msg=saved?'Gehalten!':'Daneben!';msgT=1.2;shot=null;info()}}
    if(msgT>0){msgT-=dt;if(msgT<=0){msg='';reset();if(n>=N){endGame();spend(6);gainFit('run',.6);S.laune=clamp(S.laune+goals,0,100);if(!S.best.soccer||goals>S.best.soccer)S.best.soccer=goals;menu('Elfmeterschießen',`<p><b>${goals} von ${N}</b> Elfmetern verwandelt.</p><p>Rekord: ${S.best.soccer}</p>`)}}}},
   draw(g){for(let i=0;i<8;i++){g.fillStyle=i%2?'#4caf50':'#43a047';g.fillRect(0,i*20,100,20)}g.strokeStyle='#fff';g.lineWidth=.8;g.strokeRect(10,48,80,40);g.beginPath();g.moveTo(0,48);g.lineTo(100,48);g.stroke();circ(g,50,128,1,'#fff');
    g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=.3;for(let x=22;x<80;x+=4){g.beginPath();g.moveTo(x,24);g.lineTo(x,48);g.stroke()}for(let y=26;y<48;y+=4){g.beginPath();g.moveTo(21,y);g.lineTo(79,y);g.stroke()}
    g.fillStyle='#fff';g.fillRect(19,22,2,26);g.fillRect(79,22,2,26);g.fillRect(19,22,62,2);
    g.fillStyle='#ff9f1c';rr(g,kp.x-4,32,8,16,3);circ(g,kp.x,30,2.6,'#f2c6a0');g.fillStyle='#ff9f1c';g.fillRect(kp.x-8,35,16,2.5);
    const s=shot?1-Math.min(1,shot.t)*.5:1;circ(g,ball.x,ball.y,2.6*s,'#fff');g.strokeStyle='#222';g.lineWidth=.4;g.beginPath();g.arc(ball.x,ball.y,2.6*s,0,7);g.stroke();gMsg(g,msg)}}}

const WS={T1:['Schwimmbrille ab','Neoprenanzug aus','Helm auf und zu','Radschuhe an','Rad schieben'],T2:['Rad abstellen','Helm ab','Laufschuhe an','Startnummer nach vorn','Loslaufen']};
const WX=['Handy checken','Pause machen','Snack suchen','Haare kämmen'];
function wechselGame(ph,cb){let t=0,i=0;const order=WS[ph];
  $('#gDom').innerHTML=`<div class="gcard"><h3>Wechselzone ${ph}</h3><p>${ph==='T1'?'Vom Schwimmen aufs Rad':'Vom Rad zum Laufen'} – tipp in der richtigen Reihenfolge! Falsch kostet 3 Sekunden.</p><p><b id="wt">0.0 s</b></p><div class="grid">${shuffle([...order,...shuffle(WX).slice(0,3)]).map(s=>`<button class="ing" style="font-size:15px">${s}</button>`).join('')}</div></div>`;
  $('#gDom').querySelectorAll('.ing').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;if(b.textContent===order[i]){b.classList.add('ok');i++;if(i===order.length){G.step=null;setTimeout(()=>cb(t*(1-S.wechsel/250)),300)}}else{t+=3;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad')}});
  G.step=dt=>{t+=dt;const e=$('#wt');if(e)e.textContent=t.toFixed(1)+' s'}}
function openWechsel(ph,cb){openGame('Wechselzone',{dom:true,noClose:true,init(){wechselGame(ph,t=>{endGame();toast('Wechsel in '+t.toFixed(1)+' s');cb(t)})}})}
function wechselPractice(){openGame('Wechsel üben',{dom:true,init(){let tot=0;wechselGame('T1',t1=>{tot+=t1;wechselGame('T2',t2=>{tot+=t2;endGame();spend(3);did('wechsel');
  const g=Math.max(.3,4*(1.2-S.wechsel/100));S.wechsel=Math.min(100,+(S.wechsel+g).toFixed(1));const rec=!S.best.wechsel||tot<S.best.wechsel;if(rec)S.best.wechsel=tot;
  menu('Wechsel geübt',`<p>T1 + T2 zusammen: <b>${tot.toFixed(1)} s</b>${rec?' – neue Bestzeit!':''}</p><p>Wechsel-Können +${g.toFixed(1)}</p>`)})})}})}
